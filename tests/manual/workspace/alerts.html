<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>T-8 アラート引用</title>
</head>
<body>
<h1>T-8 アラート引用</h1>
<blockquote data-alert="note">note のアラート。</blockquote>
<blockquote data-alert="tip">tip のアラート。</blockquote>
<blockquote data-alert="important">important のアラート。</blockquote>
<blockquote data-alert="warning">warning のアラート。</blockquote>
<blockquote data-alert="caution">caution のアラート。</blockquote>
<blockquote>通常の引用。</blockquote>
<blockquote data-alert="Note">大文字の Note（未知の値。通常の引用として表示される）。</blockquote>
<blockquote data-alert="foo">foo（未知の値。通常の引用として表示される）。</blockquote>
<p>アラートを指定する段落（FM-12）。</p>
</body>
</html>
