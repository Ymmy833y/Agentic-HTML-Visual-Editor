name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  check-version:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to diff package.json against.
          fetch-depth: 2

      - name: Compare package.json version with previous commit
        id: check
        run: |
          current="$(node -p "require('./package.json').version")"
          # Read the previous commit's version; treat a missing/old file as no version.
          previous="$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo '')"
          echo "current=$current previous=$previous"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to VS Code Marketplace
    needs: check-version
    # Publish only when the version changed, or when triggered manually.
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish
        # `vsce login` is interactive and cannot run in CI; pass the PAT directly instead.
        run: npx @vscode/vsce publish -p "$VSC_PAT"
        env:
          VSC_PAT: ${{ secrets.VSC_PAT }}
