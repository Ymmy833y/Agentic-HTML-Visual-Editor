name: Publish

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Actions are pinned to a commit rather than a tag, because a tag can be moved to other code. The comment names the
# release the commit belongs to.
# Every job asks for the newest Node.js 22 release rather than the one cached on the runner image, which can lag
# behind a security release until the image is rebuilt.
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
      - id: decide
        run: node scripts/release/publish-decision.mjs

  # Building runs the install scripts of every development dependency, so it happens in a job that never sees the
  # publishing credential. Only the package it makes is handed on.
  package:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSIX: agentic-html-visual-editor-${{ needs.decide.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm ci --prefer-offline --no-audit --fund=false
        working-directory: scripts/release
      - run: scripts/release/node_modules/.bin/vsce package --no-dependencies --out "$VSIX"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ env.VSIX }}
          if-no-files-found: error
          retention-days: 1

  # Only the release tools are installed here. vsce reads nothing but the package when given --packagePath, so the
  # repository's dependencies and build never run next to the credential.
  publish:
    needs: [decide, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSIX: agentic-html-visual-editor-${{ needs.decide.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          # A restored cache is written by other runs, so the job that holds the credential never uses one.
          package-manager-cache: false
      - run: npm ci --prefer-offline --no-audit --fund=false
        working-directory: scripts/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSC_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Cannot publish because the publishing credential VSC_PAT is missing from the repository secrets."
            exit 1
          fi
          scripts/release/node_modules/.bin/vsce publish --packagePath "$VSIX"
