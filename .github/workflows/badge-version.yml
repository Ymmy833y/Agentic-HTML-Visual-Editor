name: Badge version

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'

jobs:
  check:
    name: README version badge matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compare README version badges with package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "package.json version: $version"
          status=0
          for f in README.md README_ja.md; do
            # Static shields.io badge looks like:
            #   https://img.shields.io/badge/version-0.1.8-F59E0B?style=for-the-badge
            # Capture the message segment between "version-" and the color separator.
            badge="$(grep -oE 'img\.shields\.io/badge/version-[^-]+-' "$f" | head -n1 | sed -E 's#.*/version-([^-]+)-#\1#')"
            if [ -z "$badge" ]; then
              echo "::error file=$f::No static version badge found (expected img.shields.io/badge/version-<version>-...)."
              status=1
            elif [ "$badge" != "$version" ]; then
              echo "::error file=$f::Version badge is $badge but package.json is $version. Update the badge in $f to match."
              status=1
            else
              echo "$f: version badge OK ($badge)"
            fi
          done
          exit $status
